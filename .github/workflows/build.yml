name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build EX-word addon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # Keep using the toolchain that already builds the D01 successfully.
          curl -fsSL https://github.com/MaxSignal/buildscripts/releases/download/Linux/devkitPro.tar.gz | tar -xz -C ..
          export DEVKITPRO="$(cd .. && pwd)/devkitPro"
          export DEVKITSH4="$DEVKITPRO/devkitSH4"
          export PATH="$DEVKITPRO/tools/bin:$DEVKITSH4/bin:$PATH"
          make
          test -f build/ja/HEXED/hexed.d01
          test -f build/cn/HEXED/hexed.d01

      # Each artifact is automatically downloaded as a ZIP from GitHub Actions.
      # The archive contains the ready-to-install HEXED/ directory.
      - name: Upload Japanese package
        uses: actions/upload-artifact@v4
        with:
          name: exword-hex-editor-ja
          path: build/ja/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Chinese package
        uses: actions/upload-artifact@v4
        with:
          name: exword-hex-editor-cn
          path: build/cn/
          if-no-files-found: error
          retention-days: 30
