name: EXPERIMENT - Source-built EX-word mini SDK

on:
  push:
    branches: [experiment/source-built-exword-sdk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-sdk:
    name: Rebuild SDK with Hollyhock GCC (no DevKitPRO archive)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build native ELF-to-D01 tool from upstream source
        run: |
          set -euo pipefail
          source sdk-exword/sources.env
          mkdir -p .deps/elf2d01 .mini-sdk/bin
          git -C .deps/elf2d01 init -q
          git -C .deps/elf2d01 fetch -q --depth 1 https://github.com/brijohn/elf2d01.git "$ELF2D01_COMMIT"
          git -C .deps/elf2d01 checkout -q --detach FETCH_HEAD
          cc -O2 -Wall -Wextra .deps/elf2d01/elf2d01.c -o .mini-sdk/bin/elf2d01

      - name: Rebuild all EX-word components from source
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/work" -w /work --entrypoint /bin/bash \
            ghcr.io/classpaddev/hollyhock-3:v2.2.2 \
            -ec 'export PATH=/toolchain/bin:$PATH; bash scripts/build-mini-sdk.sh'

      - name: Validate executable, libraries and EX-word packages
        run: |
          set -euo pipefail
          for lib in libdataplus libgraphics libsh4a; do test -s ".mini-sdk/lib/$lib.a"; done
          test -x .mini-sdk/bin/elf2d01
          for region in ja cn; do test -s "build-minisdk/$region/XDTST/xdtest.d01"; done
          grep -Eq 'Entry point address:[[:space:]]+0x70000080' build-minisdk/elf-header.txt
          cmp build-minisdk/ja/XDTST/xdtest.d01 build-minisdk/cn/XDTST/xdtest.d01
          file build-minisdk/xdtest.elf build-minisdk/xdtest.d01

      - uses: actions/upload-artifact@v4
        with:
          name: exword-source-sdk-experiment
          path: |
            build-minisdk/ja/
            build-minisdk/cn/
            build-minisdk/elf-header.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: exword-source-sdk-libraries
          path: |
            .mini-sdk/include/
            .mini-sdk/lib/
            .mini-sdk/bin/
          if-no-files-found: error
          retention-days: 14
